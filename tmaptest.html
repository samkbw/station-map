<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T맵 링크 테스트</title>
  <style>
    body { margin: 0; padding: 16px; background: #fff; font-family: sans-serif; color: #1f2a44; }
    h1 { font-size: 17px; margin: 0 0 6px; }
    p { font-size: 13px; color: #6b7895; margin: 0 0 14px; line-height: 1.5; }
    a { display: block; margin: 0 0 10px; padding: 12px; border-radius: 10px; background: #ef3e42; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
    small { display: block; font-weight: 400; opacity: .85; margin-top: 3px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>T맵 링크 테스트 (임시)</h1>
  <p>출발 강릉역 → 경유 경포대 → 도착 정동진역. 버튼마다 T맵에 출발·경유·도착이 어떻게 들어가는지 알려 주세요.</p>
  <div id="list"></div>
  <script>
    const S = ["강릉역", 128.8996, 37.7646];
    const V = ["경포대", 128.8967, 37.7952];
    const G = ["정동진역", 129.0343, 37.6912];
    const q = (o) => new URLSearchParams(o).toString();
    const cases = [
      ["A. 도착만 (goal)", { goalname: G[0], goalx: G[1], goaly: G[2] }],
      ["B. 출발+도착 (start/goal)", { startname: S[0], startx: S[1], starty: S[2], goalname: G[0], goalx: G[1], goaly: G[2] }],
      ["C. 경유 vianame1/viax1/viay1", { startname: S[0], startx: S[1], starty: S[2], vianame1: V[0], viax1: V[1], viay1: V[2], goalname: G[0], goalx: G[1], goaly: G[2] }],
      ["D. 경유 via1name/via1x/via1y", { startname: S[0], startx: S[1], starty: S[2], via1name: V[0], via1x: V[1], via1y: V[2], goalname: G[0], goalx: G[1], goaly: G[2] }],
      ["E. 경유 rV1Name/rV1X/rV1Y + goal", { goalname: G[0], goalx: G[1], goaly: G[2], rV1Name: V[0], rV1X: V[1], rV1Y: V[2] }],
      ["F. 경유 passList", { startx: S[1], starty: S[2], goalname: G[0], goalx: G[1], goaly: G[2], passList: `${V[1]},${V[2]}` }],
      ["H. 경유 5곳 (via1~via5)", { startname: S[0], startx: S[1], starty: S[2],
        via1name: "경포대", via1x: 128.8967, via1y: 37.7952,
        via2name: "오죽헌", via2x: 128.8786, via2y: 37.7794,
        via3name: "강릉시청", via3x: 128.8761, via3y: 37.7519,
        via4name: "안목해변", via4x: 128.9472, via4y: 37.7722,
        via5name: "주문진항", via5x: 128.8270, via5y: 37.8932,
        goalname: G[0], goalx: G[1], goaly: G[2] }],
      ["G. 예전 형식 rGo (비교용)", { rGoName: G[0], rGoX: G[1], rGoY: G[2] }],
    ];
    const list = document.getElementById("list");
    cases.forEach(([label, params]) => {
      const a = document.createElement("a");
      a.href = `tmap://route?${q(params)}`;
      a.textContent = label;
      const small = document.createElement("small");
      small.textContent = a.href;
      a.appendChild(small);
      list.appendChild(a);
    });
  </script>
</body>
</html>
