<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · GitHub Pages</title>
  <!--
    경로 지도 페이지(텔레그램 미니앱). 받은 순서대로 번호 핀을 찍고 경로를 그린다.
    미니앱으로 연 것이 아니면, 그리고 등록 화면·비밀번호 화면 말고는(등록 안 된 폰, 잘못된·만료된 링크, 시간이 지나 닫힘) 404 화면처럼 보인다.
    폰 등록: ?reg=1 (보조기능의 미니앱 키보드 버튼. 키보드 버튼 미니앱은 initData가 없어 텔레그램 안인지만 본다)
      비밀번호를 정하면 열쇠(P-256)를 만들고, 비밀 열쇠는 비밀번호로 잠가 텔레그램 보안 저장소(SecureStorage, 이 봇 전용)에 둔다.
      공개 열쇠(압축 33바이트, base64url 44자)는 sendData({"t": "map_reg", "k": 공개 열쇠})로 챗봇에 보낸다.
    데이터: #r2=<base64url(일회용 공개 열쇠 65 | IV 12 | 암호문)>  (서버로 전송되지 않음, 읽은 뒤 주소에서 지움)
      비밀번호로 비밀 열쇠를 풀고 ECDH → HKDF-SHA256(info "route-map-v2") → AES-256-GCM 으로 푼 뒤 deflate-raw 를 푼다.
      풀린 내용 = {"x": 만료 epoch 초(10분), "d": JSON}. 서버 쪽 잠그기는 apps/map_crypto.py 와 같이 바꾼다.
      JSON = {"o": [위도, 경도, 이름] | null, "s": [[위도, 경도, 이름, 건수[A, J, S], 국사정보[8], 메모[], 업무[[국소명, 업무구분, 제목, 시작, 마감]]], ...]}
      o = 출발·복귀 지점(사무실), s = 방문 순서대로의 국소. 링크 한도로 팝업 내용을 못 넣은 국소는 5번째가 null.
    풀린 데이터는 저장하지 않고, 지도를 연 지 60분이 지나면 화면과 함께 지운다(1분마다·화면 복귀·지도 조작 때 실제 시각으로 확인).
    경로 선: OSRM 공개 서버(도로 경로). 실패하면 직선거리·시속 40km로 대신 그린다.
    길찾기 연동(휴대폰에서 확인한 값): 출발·도착 포함 카카오맵 최대 7곳, T맵 최대 4곳(경유 2곳).
      카카오맵은 전부 넣는다(7곳에서 스스로 멈추고 7번째가 도착지).
      T맵은 직접 잘라 넣는다: 국소가 다 들어가면 사무실로 복귀, 넘으면 연동 가능한 마지막 국소가 도착지.
    공개 저장소에도 그대로 올리는 파일이므로 내부 이름·주소를 적지 않는다.
  -->
  <!-- 텔레그램 미니앱 기능(initData·SecureStorage·sendData). 주소의 # 를 읽어야 하므로 아래 페이지 스크립트보다 먼저 불러온다. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #fff; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }
    #map { position: relative; flex: 1; min-height: 0; }
    #summary { position: absolute; z-index: 1000; top: 10px; left: 50%; transform: translateX(-50%); width: calc(100% - 24px); box-sizing: border-box; padding: 6px 12px; border-radius: 8px; background: rgba(255,255,255,.94); box-shadow: 0 2px 8px rgba(15,23,42,.18); color: #1f2a44; font-size: 12px; font-weight: 700; text-align: center; white-space: pre-line; }
    .leaflet-control-attribution { font-size: 9px; }
    .leaflet-top { top: 52px; } /* 넓힌 안내 상자 아래로 확대·지도 전환 버튼을 내림 */
    .map-layer-switch { display: flex; flex-direction: column; width: 34px; gap: 4px; background: transparent; }
    .leaflet-touch .map-layer-switch { border: 0; }
    .map-layer-btn { border: 1px solid rgba(0,0,0,.2); border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.18); background: #fff; color: #374665; font-size: 9.5px; font-weight: 700; padding: 4px 2px; cursor: pointer; line-height: 1.2; text-align: center; }
    .map-layer-btn.is-active { background: #3f57d5; color: #fff; }
    /* 번호 핀 (웹과 같은 모양) */
    .route-map-pin { display: grid; width: 26px; height: 26px; box-sizing: border-box; place-items: center; border: 2px solid #fff; border-radius: 50%; color: #fff; background: #16a34a; box-shadow: 0 4px 12px rgba(15,23,42,.3); font-size: 10px; font-weight: 900; }
    .route-map-pin.is-office { background: #0f172a; }
    .route-map-pin.is-off { background: #cbd5e1; color: #475569; }
    .route-map-pin { position: relative; }
    .route-map-tag { position: absolute; bottom: calc(100% + 4px); left: 50%; padding: 2px 6px; border: 1px solid #d5ddeb; border-radius: 6px; background: rgba(255,255,255,.95); box-shadow: 0 1px 4px rgba(15,23,42,.18); color: #1f2a44; font-size: 10.5px; font-weight: 800; white-space: nowrap; transform: translateX(-50%); pointer-events: none; }
    .route-map-pin.is-off .route-map-tag { color: #94a3b8; background: rgba(241,245,249,.92); }
    /* 하단 버튼 */
    #panel { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #e5eaf3; background: #fff; }
    /* 국소 팝업이 열리면 패널을 접고 손잡이만 남긴다(누르거나 위로 끌면 다시 펼침). 높이를 0.25초 동안 바꿔 스르륵 움직인다. */
    #panel-handle, #panel-body { overflow: hidden; transition: max-height .25s ease, opacity .25s ease; }
    #panel-handle { max-height: 0; opacity: 0; cursor: pointer; touch-action: none; }
    #panel-handle span { display: block; width: 44px; height: 5px; margin: 2px auto 10px; border-radius: 999px; background: #cbd5e1; }
    #panel-body { max-height: 360px; }
    #panel.is-collapsed #panel-handle { max-height: 24px; opacity: 1; }
    #panel.is-collapsed #panel-body { max-height: 0; opacity: 0; }
    /* 내 위치 (카카오맵과 같은 모양: 빨간 점 + 흰 테두리, 바라보는 방향 삼각형) */
    .my-loc { position: relative; width: 36px; height: 36px; }
    .my-loc-dot { position: absolute; top: 9px; left: 9px; width: 18px; height: 18px; box-sizing: border-box; border: 3px solid #fff; border-radius: 50%; background: #ef2b2b; box-shadow: 0 1px 5px rgba(0,0,0,.4); }
    .my-loc-arrow { position: absolute; inset: 0; display: none; }
    .my-loc-arrow::before { position: absolute; top: -1px; left: 50%; border-right: 6px solid transparent; border-bottom: 9px solid #ef2b2b; border-left: 6px solid transparent; content: ""; transform: translateX(-50%); }
    .my-loc.has-heading .my-loc-arrow { display: block; }
    /* 내 위치 버튼 (카카오맵처럼 흰 동그라미 + 파란 조준선, 따라가기 중이면 파랗게 채움) */
    .my-loc-btn { display: grid; width: 46px; height: 46px; place-items: center; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.25); color: #2f6fed; cursor: pointer; }
    .my-loc-btn.is-follow { background: #2f6fed; color: #fff; }
    .leaflet-touch .leaflet-control.my-loc-control { border: 0; }
    .panel-row { display: flex; gap: 8px; }
    .panel-row + .panel-row { margin-top: 8px; }
    .panel-btn { flex: 1; padding: 11px 6px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 800; text-align: center; text-decoration: none; cursor: pointer; }
    .panel-btn.is-kakao { background: #fee500; color: #191919; }
    .panel-btn.is-tmap { background: #0064ff; color: #fff; }
    .panel-btn.is-nav { background: #eef2ff; color: #3f57d5; }
    .panel-btn.is-nav.is-on { background: #3f57d5; color: #fff; }
    .panel-btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
    #panel-note { margin-top: 8px; color: #6b7895; font-size: 11.5px; line-height: 1.45; white-space: pre-line; }
    /* 국소 팝업 (지도보기와 같은 모양) */
    :root { --primary: #3e6ee8; --muted: #6b7895; --text: #1f2a44; }
    .work-marker-popup .leaflet-popup-content-wrapper { padding: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 40px rgba(15,23,42,.22), 0 2px 8px rgba(15,23,42,.08); }
    .work-marker-popup .leaflet-popup-content { width: auto !important; margin: 0; }
    .work-marker-popover { width: min(430px, calc(100vw - 72px)); } /* 왼쪽 버튼 폭(56px)과 오른쪽 여백을 뺀 폭 */
    .work-marker-popover-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 40px 12px 14px; border-bottom: 1px solid #eef1f7; background: linear-gradient(165deg, #f5f8ff, #fdfbff); }
    .work-marker-popover-heading strong { overflow: hidden; color: #1c2b4a; font-size: 12.5px; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
    .work-marker-popover-heading span { flex: 0 0 auto; padding: 2px 8px; border-radius: 999px; color: var(--primary); background: rgba(62,110,232,.1); font-size: 10.5px; font-weight: 800; }
    .work-marker-omitted { padding: 9px 14px; color: #92400e; background: #fffbeb; font-size: 11px; font-weight: 700; }
    .work-marker-popover-table { max-height: 260px; overflow-y: auto; }
    .work-marker-popover-row { display: grid; grid-template-columns: minmax(90px, 1.1fr) minmax(60px, .8fr) minmax(120px, 1.8fr); border-bottom: 1px solid #edf1f7; }
    .work-marker-popover-row:last-child { border-bottom: 0; }
    .work-marker-popover-row span { min-width: 0; padding: 7px 9px; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .work-marker-popover-row span + span { border-left: 1px solid #edf1f7; }
    .work-marker-popover-row.is-header { position: sticky; z-index: 1; top: 0; color: var(--muted); background: #f9fbfe; font-weight: 800; }
    .work-marker-row-occurred { display: block; margin-top: 1px; overflow: hidden; color: #b42318; font-size: 9.5px; font-weight: 700; text-overflow: ellipsis; }
    .work-marker-equip-box { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 8px 11px; border-top: 1px solid #e5eaf3; background: #f8faff; }
    .work-marker-equip-box > .work-marker-equip-field { grid-column: span 2; }
    .work-marker-equip-box > .work-marker-equip-field:nth-child(-n+2) { grid-column: span 3; }
    .work-marker-equip-field { display: grid; gap: 2px; min-width: 0; }
    .work-marker-equip-field span { color: var(--muted); font-size: 9px; font-weight: 800; }
    .work-marker-equip-field strong { overflow: hidden; color: var(--text); font-size: 11px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .work-marker-memo-row { display: flex; align-items: center; gap: 6px; padding: 9px 11px; border-top: 1px solid #e5eaf3; background: #fff; }
    .work-marker-memo-content { flex: 1; min-width: 0; overflow: hidden; color: #4c1d95; font-size: 10.5px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .work-marker-popup-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 12px 10px; border-top: 1px solid #e5eaf3; background: #fff; }
    .work-marker-popup-button { display: flex; align-items: center; justify-content: center; min-height: 36px; border-radius: 10px; font-size: 12px; font-weight: 800; text-align: center; text-decoration: none; }
    .work-marker-popup-button.is-tmap { background: #0064ff; color: #fff !important; }
    .work-marker-popup-button.is-kakao { background: #fee500; color: #191919 !important; }
    .work-marker-popup-button.is-roadview { background: #334155; color: #fff !important; }
    .work-marker-memo-status { flex: 0 0 auto; border-radius: 999px; padding: 5px 14px; font-size: 10.5px; font-weight: 900; color: #92400e; background: #fef3c7; }
    /* hidden 속성은 아래 display 지정보다 항상 우선한다(숨긴 칸·버튼이 보이지 않게). */
    [hidden] { display: none !important; }
    /* 잠금 화면(폰 등록·비밀번호). 풀리기 전에는 지도를 그리지 않는다. */
    #gate { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px; background: #f5f7fb; }
    .gate-box { width: 100%; max-width: 360px; box-sizing: border-box; padding: 20px 18px; border-top: 6px solid #3f57d5; border-radius: 14px; background: #fff; box-shadow: 0 6px 24px rgba(15,23,42,.12); color: #1f2a44; }
    .gate-box.is-register { border-top-color: #16a34a; }
    .gate-title { margin: 0 0 8px; font-size: 16px; font-weight: 900; }
    .gate-text { margin: 0 0 14px; color: #4b587a; font-size: 13px; line-height: 1.5; white-space: pre-line; }
    .gate-input { display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 11px 12px; border: 1px solid #cfd8e6; border-radius: 10px; font-size: 15px; }
    .gate-btn { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px; border: 0; border-radius: 10px; background: #3f57d5; color: #fff; font-size: 15px; font-weight: 800; text-align: center; text-decoration: none; cursor: pointer; }
    .gate-box.is-register .gate-btn { background: #16a34a; }
    .gate-btn:disabled { opacity: .5; }
    .gate-error { min-height: 18px; margin: 6px 0 0; color: #b42318; font-size: 12.5px; font-weight: 700; white-space: pre-line; }
    /* 쓸 수 없는 링크일 때 보이는 화면(GitHub Pages 404와 같은 모양) */
    #notfound { position: fixed; inset: 0; z-index: 4000; padding: 60px 16px; background: #fff; color: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-align: center; }
    #notfound h1 { margin: 0 0 4px; font-size: 96px; font-weight: 300; line-height: 1; color: #444; }
    #notfound h2 { margin: 0 0 24px; font-size: 22px; font-weight: 400; }
    #notfound p { max-width: 480px; margin: 0 auto 12px; color: #57606a; font-size: 15px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="notfound" hidden>
    <h1>404</h1>
    <h2>File not found</h2>
    <p>The site configured at this address does not contain the requested file.</p>
    <p>If this is your site, make sure that the filename case matches the URL as well as any file permissions.</p>
  </div>
  <div id="gate">
    <form id="gate-form" class="gate-box" autocomplete="off" hidden>
      <h1 id="gate-title" class="gate-title"></h1>
      <p id="gate-text" class="gate-text"></p>
      <input id="gate-pw" class="gate-input" type="password" autocomplete="off" placeholder="비밀번호" hidden />
      <input id="gate-pw2" class="gate-input" type="password" autocomplete="off" placeholder="비밀번호 확인" hidden />
      <button id="gate-submit" class="gate-btn" type="submit" hidden></button>
      <p id="gate-error" class="gate-error"></p>
    </form>
  </div>
  <div id="map"><div id="summary">경로를 불러오는 중…</div></div>
  <div id="panel">
    <div id="panel-handle" role="button" aria-label="전체 경로 버튼 다시 보기"><span></span></div>
    <div id="panel-body">
      <div class="panel-row">
        <a id="btn-tmap" class="panel-btn is-tmap" rel="noopener noreferrer">T맵 전체 경로</a>
        <a id="btn-kakao" class="panel-btn is-kakao" target="_blank" rel="noopener noreferrer">카카오맵 전체 경로</a>
      </div>
      <div class="panel-row">
        <button id="btn-nav" class="panel-btn is-nav" type="button">길찾기 국소선택: 꺼짐</button>
      </div>
      <div id="panel-note"></div>
    </div>
  </div>
  <script>
    (() => {
      const KAKAO_MAX_POINTS = 7; // 카카오맵 연동 최대 지점 수(출발·도착 포함)
      const TMAP_MAX_POINTS = 4; // T맵 연동 최대 지점 수(출발·경유 2·도착)
      const GUIDE_TEXT = "내 스케줄 국소만 표시됩니다.\n다른 국소와 알람은 각 메뉴에서 확인해 주세요.";
      const EQUIP_LABELS = ["장비타입", "제조사", "총층수", "설치층", "국사형태", "옥상옥탑", "공용대표구분", "공용화주관사"];
      const OMITTED_TEXT = "업무가 많아 표시하지 못했습니다. 텔레그램 국소 버튼에서 확인해 주세요.";
      const OSRM_TIMEOUT_MS = 8000;
      const FALLBACK_SPEED_KMH = 40;

      const summary = document.getElementById("summary");
      const note = document.getElementById("panel-note");
      const kakaoButton = document.getElementById("btn-kakao");
      const tmapButton = document.getElementById("btn-tmap");
      const navButton = document.getElementById("btn-nav");

      function textOf(value) {
        return value === null || value === undefined ? "" : String(value).trim();
      }

      function validPoint(row) {
        if (!Array.isArray(row)) return null;
        const lat = Number(row[0]);
        const lon = Number(row[1]);
        if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
        return { lat, lon, name: textOf(row[2]) || `${lat.toFixed(5)}, ${lon.toFixed(5)}` };
      }

      // 풀린 지도 데이터 {"o", "s"} 확인. 형식이 틀리면 null.
      function parseData(data) {
        try {
          const stops = (Array.isArray(data?.s) ? data.s : []).map((row) => {
            const point = validPoint(row);
            if (!point) return null;
            const list = (value) => (Array.isArray(value) ? value : []);
            point.counts = list(row[3]).map((value) => Number(value) || 0);
            point.omitted = row[4] === null;
            point.equip = list(row[4]).map(textOf);
            point.memos = list(row[5]).map(textOf);
            point.items = list(row[6]).filter(Array.isArray).map((item) => item.map(textOf));
            return point;
          }).filter(Boolean);
          return { office: validPoint(data.o), stops };
        } catch (error) {
          console.error("[ROUTE] data parse failed", error?.name || error);
          return null;
        }
      }

      function haversineKm(a, b) {
        const rad = (x) => (x * Math.PI) / 180;
        const dLat = rad(b.lat - a.lat);
        const dLon = rad(b.lon - a.lon);
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
        return 2 * 6371 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      }

      // OSRM 실패 시: 직선거리·시속 40km(구간 최소 1분). 웹과 같은 계산.
      function fallbackRoute(points) {
        let distance = 0;
        let duration = 0;
        for (let index = 1; index < points.length; index += 1) {
          const km = haversineKm(points[index - 1], points[index]);
          distance += km * 1000;
          duration += Math.max(60, Math.round((km / FALLBACK_SPEED_KMH) * 3600));
        }
        return { coordinates: points.map((p) => [p.lat, p.lon]), distance, duration, fallback: true };
      }

      async function fetchRoute(points) {
        if (points.length < 2) return fallbackRoute(points);
        const coords = points.map((p) => `${p.lon.toFixed(6)},${p.lat.toFixed(6)}`).join(";");
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), OSRM_TIMEOUT_MS);
        try {
          const response = await fetch(
            `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`,
            { signal: controller.signal },
          );
          if (!response.ok) return fallbackRoute(points);
          const route = (await response.json())?.routes?.[0];
          if (!route) return fallbackRoute(points);
          return {
            coordinates: (route.geometry?.coordinates || []).map(([lon, lat]) => [lat, lon]),
            distance: Number(route.distance || 0),
            duration: Number(route.duration || 0),
            fallback: false,
          };
        } catch (error) {
          console.warn("[ROUTE] OSRM load failed; fallback route used", error?.name || error);
          return fallbackRoute(points);
        } finally {
          clearTimeout(timer);
        }
      }

      // 길찾기 연동 지점: 출발(사무실) + 국소. 들어가면 사무실 복귀, 넘치면 연동 가능한 마지막 국소가 도착지.
      function navPoints(office, stops, maxPoints) {
        const start = office ? [office] : [];
        const room = maxPoints - start.length;
        if (office && stops.length <= room - 1) return { points: [office, ...stops, office], cut: 0 };
        const used = stops.slice(0, room);
        return { points: [...start, ...used], cut: stops.length - used.length };
      }

      function safeName(name) {
        return name.replace(/[,/]/g, " ");
      }

      function kakaoUrl(points) {
        const parts = points.map((p) => `${encodeURIComponent(safeName(p.name))},${p.lat},${p.lon}`);
        return `https://map.kakao.com/link/by/car/${parts.join("/")}`;
      }

      // T맵 형식: start… / via{n}name·via{n}x·via{n}y / goal… (x=경도, y=위도). 휴대폰에서 직접 확인한 형식.
      function tmapUrl(points) {
        const start = points[0];
        const goal = points[points.length - 1];
        const params = new URLSearchParams({
          startname: start.name, startx: String(start.lon), starty: String(start.lat),
        });
        points.slice(1, -1).forEach((p, index) => {
          params.set(`via${index + 1}name`, p.name);
          params.set(`via${index + 1}x`, String(p.lon));
          params.set(`via${index + 1}y`, String(p.lat));
        });
        params.set("goalname", goal.name);
        params.set("goalx", String(goal.lon));
        params.set("goaly", String(goal.lat));
        return `tmap://route?${params.toString()}`;
      }

      function setLink(button, url) {
        if (url) {
          button.href = url;
          button.removeAttribute("aria-disabled");
        } else {
          button.removeAttribute("href");
          button.setAttribute("aria-disabled", "true");
        }
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      // "2026-11-10 10:03" → "11-10 10:03" (웹 팝업과 같은 표시)
      function shortDate(value) {
        return value ? value.slice(5) : "";
      }

      // 국소 팝업(지도보기와 같은 내용). 링크로 받은 값은 textContent 로만 넣는다.
      function buildPopup(stop, index) {
        const box = element("div", "work-marker-popover");
        const heading = element("div", "work-marker-popover-heading");
        heading.appendChild(element("strong", "", `${index + 1}. ${stop.name}`));
        if (stop.items.length) heading.appendChild(element("span", "", `${stop.items.length.toLocaleString("ko-KR")}건`));
        box.appendChild(heading);
        if (stop.omitted) {
          box.append(element("div", "work-marker-omitted", OMITTED_TEXT), buildPopupActions(stop));
          return box;
        }
        if (stop.items.length) {
          const table = element("div", "work-marker-popover-table");
          const header = element("div", "work-marker-popover-row is-header");
          ["국소명", "업무구분", "제목"].forEach((label) => header.appendChild(element("span", "", label)));
          table.appendChild(header);
          stop.items.forEach(([siteName, workType, title, startAt, dueDate]) => {
            const row = element("div", "work-marker-popover-row");
            row.appendChild(element("span", "", siteName));
            row.appendChild(element("span", "", workType));
            const titleCell = element("span", "", title);
            titleCell.title = `${title}\n시작 ${startAt || "-"} ~ 마감 ${dueDate || "-"}`;
            if (startAt || dueDate) {
              const period = startAt ? [shortDate(startAt), shortDate(dueDate)].filter(Boolean).join(" ~ ") : `~ ${shortDate(dueDate)}`;
              titleCell.appendChild(element("small", "work-marker-row-occurred", period));
            }
            row.appendChild(titleCell);
            table.appendChild(row);
          });
          box.appendChild(table);
        }
        if (stop.equip.some(Boolean)) {
          const equipBox = element("div", "work-marker-equip-box");
          EQUIP_LABELS.forEach((label, i) => {
            const field = element("div", "work-marker-equip-field");
            field.appendChild(element("span", "", label));
            field.appendChild(element("strong", "", stop.equip[i] || "—"));
            equipBox.appendChild(field);
          });
          box.appendChild(equipBox);
        }
        stop.memos.forEach((memo) => {
          const memoRow = element("div", "work-marker-memo-row");
          const content = element("span", "work-marker-memo-content", memo);
          content.title = memo;
          memoRow.append(content, element("span", "work-marker-memo-status", "처리중"));
          box.appendChild(memoRow);
        });
        box.appendChild(buildPopupActions(stop));
        return box;
      }

      // 국소 팝업 아래 버튼 줄(dmov-11 팝업 버튼 줄과 같은 모양): 현재 위치 → 이 국소 길찾기, 로드뷰.
      function buildPopupActions(stop) {
        const actions = element("div", "work-marker-popup-actions");
        const tmapParams = new URLSearchParams({ goalname: stop.name, goalx: String(stop.lon), goaly: String(stop.lat) });
        [
          ["T맵 길찾기", "is-tmap", `tmap://route?${tmapParams.toString()}`],
          ["카카오맵 길찾기", "is-kakao", `https://map.kakao.com/link/to/${encodeURIComponent(safeName(stop.name))},${stop.lat},${stop.lon}`],
          ["로드뷰", "is-roadview", `https://map.kakao.com/link/roadview/${stop.lat},${stop.lon}`],
        ].forEach(([label, className, url]) => {
          const link = element("a", `work-marker-popup-button ${className}`, label);
          link.href = url;
          if (className !== "is-tmap") link.target = "_blank";
          link.rel = "noopener noreferrer";
          actions.appendChild(link);
        });
        return actions;
      }

      // 내 위치 버튼. 지도를 열 때는 아무것도 하지 않고, 누를 때부터 위치를 쓴다(권한도 그때 처음 묻는다).
      //   1번째: 내 위치로 지도를 한 번 옮기고 빨간 점 표시. 이후 점만 움직이고 화면은 그대로.
      //   2번째: 따라가기(화면이 내 위치를 따라감). 지도를 끌거나 한 번 더 누르면 따라가기만 끈다.
      function setupMyLocation(map) {
        const ICON_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
        let watchId = null;
        let follow = false;
        let firstFix = false;
        let marker = null;
        let lastLatLng = null;
        let compassOn = false;

        const button = element("button", "my-loc-btn");
        button.type = "button";
        button.title = "내 위치";
        button.innerHTML = ICON_SVG;
        const Control = L.Control.extend({
          options: { position: "bottomright" },
          onAdd() {
            const wrapper = L.DomUtil.create("div", "leaflet-control my-loc-control");
            wrapper.appendChild(button);
            L.DomEvent.disableClickPropagation(wrapper);
            return wrapper;
          },
        });
        map.addControl(new Control());

        function setFollow(on) {
          follow = on;
          button.classList.toggle("is-follow", on);
        }

        function showNotice(message) {
          summary.textContent = message ? `${GUIDE_TEXT}\n⚠️ ${message}` : GUIDE_TEXT;
        }

        function setHeading(degrees) {
          const node = marker?.getElement()?.querySelector(".my-loc");
          if (!node) return;
          node.classList.add("has-heading");
          node.querySelector(".my-loc-arrow").style.transform = `rotate(${degrees}deg)`;
        }

        // 나침반: 안드로이드는 deviceorientationabsolute, 아이폰은 webkitCompassHeading. 값이 없으면 삼각형 없이 점만.
        function onOrientation(event) {
          let heading = null;
          if (typeof event.webkitCompassHeading === "number") heading = event.webkitCompassHeading;
          else if (event.absolute && typeof event.alpha === "number") heading = 360 - event.alpha;
          if (heading !== null) setHeading((heading + (screen.orientation?.angle || 0)) % 360);
        }
        function startCompass() {
          if (compassOn) return;
          compassOn = true;
          const listen = () => {
            if ("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute", onOrientation);
            else window.addEventListener("deviceorientation", onOrientation);
          };
          if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
            DeviceOrientationEvent.requestPermission()
              .then((state) => { if (state === "granted") listen(); else console.warn("[ROUTE] compass permission", state); })
              .catch((error) => console.warn("[ROUTE] compass permission failed", error));
          } else {
            listen();
          }
        }

        function onPosition(position) {
          lastLatLng = L.latLng(position.coords.latitude, position.coords.longitude);
          if (!marker) {
            marker = L.marker(lastLatLng, {
              icon: L.divIcon({ className: "", html: '<div class="my-loc"><div class="my-loc-arrow"></div><div class="my-loc-dot"></div></div>', iconSize: [36, 36], iconAnchor: [18, 18] }),
              interactive: false, keyboard: false, zIndexOffset: 1000,
            }).addTo(map);
          } else {
            marker.setLatLng(lastLatLng);
          }
          showNotice("");
          if (firstFix) {
            firstFix = false;
            map.setView(lastLatLng, Math.max(map.getZoom(), 15));
          } else if (follow) {
            map.panTo(lastLatLng);
          }
        }

        function onError(error) {
          console.warn("[ROUTE] geolocation failed", error.code, error.message);
          const messages = {
            1: "위치 권한이 꺼져 있어 내 위치를 표시하지 못했습니다. 크롬 사이트 설정에서 위치를 허용해 주세요.",
            2: "내 위치를 가져오지 못했습니다. GPS가 켜져 있는지 확인해 주세요.",
            3: "내 위치를 가져오는 데 시간이 오래 걸리고 있습니다.",
          };
          showNotice(messages[error.code] || "내 위치를 가져오지 못했습니다.");
          if (error.code === 1) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            setFollow(false);
          }
        }

        button.addEventListener("click", () => {
          if (!navigator.geolocation) {
            showNotice("이 브라우저는 위치 기능을 지원하지 않습니다.");
            return;
          }
          if (watchId === null) {
            firstFix = true;
            watchId = navigator.geolocation.watchPosition(onPosition, onError, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
            startCompass();
            console.info("[ROUTE] my location started");
            return;
          }
          if (!follow) {
            setFollow(true);
            if (lastLatLng) map.panTo(lastLatLng);
          } else {
            setFollow(false);
          }
        });
        map.on("dragstart", () => setFollow(false));
        return { stopFollow: () => setFollow(false) };
      }

      // 전체 보기 버튼(내 위치 버튼 바로 위): 처음 열 때처럼 사무실과 국소 전체가 한 화면에 들어오게 맞춘다.
      function addFitAllControl(map, fitAll) {
        const button = element("button", "my-loc-btn");
        button.type = "button";
        button.title = "전체 경로 보기";
        button.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
        button.addEventListener("click", fitAll);
        const Control = L.Control.extend({
          options: { position: "bottomright" },
          onAdd() {
            const wrapper = L.DomUtil.create("div", "leaflet-control my-loc-control");
            wrapper.appendChild(button);
            L.DomEvent.disableClickPropagation(wrapper);
            return wrapper;
          },
        });
        map.addControl(new Control());
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
      }

      // 핀 위 이름표: 텔레그램 스케줄 목록 버튼과 같은 형식 "1. [A:1 J:2] 국소명", 업무가 없으면 "[0건]".
      function stopTag(stop, index) {
        const tags = ["A", "J", "S"].map((key, i) => (stop.counts[i] ? `${key}:${stop.counts[i]}` : "")).filter(Boolean);
        return `${index + 1}. ${tags.length ? `[${tags.join(" ")}]` : "[0건]"} ${stop.name}`;
      }

      function pinIcon(label, className, tag = "") {
        // 링크로 받은 이름이 들어가므로 HTML로 해석되지 않게 바꿔 넣는다.
        const tagHtml = tag ? `<div class="route-map-tag">${escapeHtml(tag)}</div>` : "";
        return L.divIcon({ className: "", html: `<div class="route-map-pin ${className}">${tagHtml}${label}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
      }

      // 풀린 데이터로만 지도를 그린다. 돌려주는 map은 60분 뒤 닫을 때 지운다.
      function render(rawData) {
        if (typeof L === "undefined") {
          summary.textContent = "지도 라이브러리를 불러오지 못했습니다.";
          return null;
        }
        const map = L.map("map", { zoomControl: true }).setView([37.5665, 126.978], 11);
        const normalLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19, subdomains: "abc",
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);
        const satelliteLayers = [
          L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            { maxZoom: 19, attribution: "Tiles &copy; Esri &mdash; Source: Esri and the GIS User Community" }),
          L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
            { maxZoom: 19 }),
        ];
        const LayerSwitcher = L.Control.extend({
          options: { position: "topleft" },
          onAdd() {
            const wrapper = L.DomUtil.create("div", "map-layer-switch leaflet-bar");
            const sat = L.DomUtil.create("button", "map-layer-btn", wrapper);
            const nor = L.DomUtil.create("button", "map-layer-btn is-active", wrapper);
            sat.type = "button"; sat.textContent = "위성";
            nor.type = "button"; nor.textContent = "일반";
            L.DomEvent.disableClickPropagation(wrapper);
            const setMode = (satellite) => {
              if (satellite) { map.removeLayer(normalLayer); satelliteLayers.forEach((l) => map.addLayer(l)); }
              else { satelliteLayers.forEach((l) => map.removeLayer(l)); map.addLayer(normalLayer); }
              sat.classList.toggle("is-active", satellite);
              nor.classList.toggle("is-active", !satellite);
            };
            sat.addEventListener("click", () => setMode(true));
            nor.addEventListener("click", () => setMode(false));
            return wrapper;
          },
        });
        map.addControl(new LayerSwitcher());

        const data = parseData(rawData);
        if (!data || !data.stops.length) {
          summary.textContent = "표시할 경로가 없습니다.";
          setLink(kakaoButton, ""); setLink(tmapButton, "");
          navButton.disabled = true;
          return map;
        }
        const { office, stops } = data;
        const selected = stops.map(() => true);
        let navMode = false;
        const markers = [];
        const stopIcon = (index) => pinIcon(String(index + 1), selected[index] ? "" : "is-off", stopTag(stops[index], index));

        if (office) {
          L.marker([office.lat, office.lon], { icon: pinIcon("출", "is-office"), keyboard: false })
            .bindPopup(document.createTextNode(`출발·복귀: ${office.name}`)).addTo(map);
        }
        stops.forEach((stop, index) => {
          const marker = L.marker([stop.lat, stop.lon], { icon: stopIcon(index), keyboard: false }).addTo(map);
          marker.bindPopup(() => buildPopup(stop, index), {
            className: "work-marker-popup", maxWidth: 460, minWidth: 0,
            autoPanPaddingTopLeft: L.point(56, 70), // 상단 안내 상자·왼쪽 확대/지도 전환 버튼에 가리지 않게
          });
          marker.on("click", () => {
            if (!navMode) return;
            marker.closePopup();
            selected[index] = !selected[index];
            marker.setIcon(stopIcon(index));
            updateNav();
          });
          markers.push(marker);
        });

        const routePoints = office ? [office, ...stops, office] : stops;
        const fitRoute = () => map.fitBounds(routePoints.map((p) => [p.lat, p.lon]), { padding: [40, 40], maxZoom: 15 });
        fitRoute();

        function updateNav() {
          const chosen = stops.filter((_stop, index) => selected[index]);
          // 카카오맵은 다 넣어도 7곳에서 멈추고 7번째가 도착지가 되므로 자르지 않는다(개수는 안내용으로만 센다).
          const kakaoAll = office ? [office, ...chosen, office] : chosen;
          const kakao = navPoints(office, chosen, KAKAO_MAX_POINTS);
          // T맵은 경유 2곳 이후를 무시하고 도착지로 가므로 도착지를 직접 정해 넣는다.
          const tmap = navPoints(office, chosen, TMAP_MAX_POINTS);
          setLink(kakaoButton, kakaoAll.length >= 2 ? kakaoUrl(kakaoAll) : "");
          setLink(tmapButton, tmap.points.length >= 2 ? tmapUrl(tmap.points) : "");
          // 국소선택을 켜면 고른 국소로만 가는 것이 버튼에 보이게 이름을 바꾼다.
          const scope = navMode ? `선택 경로 (${chosen.length}곳)` : "전체 경로";
          tmapButton.textContent = `T맵 ${scope}`;
          kakaoButton.textContent = `카카오맵 ${scope}`;
          const lines = [`출발·도착 포함 카카오맵은 최대 ${KAKAO_MAX_POINTS}곳, T맵은 최대 ${TMAP_MAX_POINTS}곳까지 연동됩니다.`];
          const cuts = [];
          if (kakao.cut > 0) cuts.push(`카카오맵 ${kakao.cut}곳`);
          if (tmap.cut > 0) cuts.push(`T맵 ${tmap.cut}곳`);
          if (cuts.length) lines.push("연동되지 않은 국소는 도착 후 [길찾기 국소선택]으로 다시 길찾기를 해 주세요.");
          if (navMode) lines.push(`길찾기 국소선택: 번호 핀을 눌러 선택·해제하세요. 선택 ${chosen.length}곳`);
          note.textContent = lines.join("\n");
        }

        navButton.addEventListener("click", () => {
          navMode = !navMode;
          navButton.classList.toggle("is-on", navMode);
          navButton.textContent = navMode ? "길찾기 국소선택: 켜짐 (핀을 눌러 선택·해제)" : "길찾기 국소선택: 꺼짐";
          if (!navMode) {
            selected.fill(true);
            markers.forEach((marker, index) => marker.setIcon(stopIcon(index)));
          }
          updateNav();
        });
        updateNav();

        // 국소 팝업이 열리면 하단 패널을 접고, 팝업이 닫히면 자동으로 펼친다.
        // 다른 핀으로 바로 옮길 때는 닫힘·열림이 연달아 오므로 닫힘은 한 박자 늦게 보고 열린 팝업이 없을 때만 펼친다.
        const panel = document.getElementById("panel");
        const handle = document.getElementById("panel-handle");
        let openPopup = null;
        function setPanelCollapsed(collapsed) {
          if (panel.classList.contains("is-collapsed") === collapsed) return;
          panel.classList.toggle("is-collapsed", collapsed);
        }
        // 움직임이 끝난 뒤 지도 크기를 맞춘다(중간에 맞추면 지도가 덜컥거림).
        document.getElementById("panel-body").addEventListener("transitionend", (event) => {
          if (event.propertyName === "max-height") map.invalidateSize({ pan: false });
        });
        map.on("popupopen", (event) => {
          openPopup = event.popup;
          if (!navMode) setPanelCollapsed(true);
        });
        map.on("popupclose", (event) => {
          if (openPopup === event.popup) openPopup = null;
          setTimeout(() => { if (!openPopup) setPanelCollapsed(false); }, 0);
        });
        // 손잡이: 누르거나 위로 끌면 펼친다(팝업은 그대로 둔다).
        let dragStartY = null;
        handle.addEventListener("pointerdown", (event) => { dragStartY = event.clientY; });
        handle.addEventListener("pointerup", (event) => {
          const moved = dragStartY === null ? 0 : event.clientY - dragStartY;
          dragStartY = null;
          if (moved <= 10) setPanelCollapsed(false);
        });

        const myLocation = setupMyLocation(map);
        // bottomright는 나중에 붙인 버튼이 위로 쌓이므로 내 위치 버튼 위에 놓인다.
        addFitAllControl(map, () => {
          myLocation.stopFollow();
          fitRoute();
        });

        summary.textContent = GUIDE_TEXT;
        fetchRoute(routePoints).then((route) => {
          if (route.coordinates.length > 1) {
            L.polyline(route.coordinates, { color: "#2563eb", weight: 5, opacity: 0.86 }).addTo(map);
          }
          console.info("[ROUTE] route drawn", { stops: stops.length, fallback: route.fallback });
        });
        return map;
      }

      // ===== 잠금(폰 등록·비밀번호) =====
      // 텔레그램 보안 저장소(이 봇 미니앱 전용)에 두는 것: 비밀번호로 잠근 비밀 열쇠와 공개 열쇠뿐
      const DEVICE_STORE_KEY = "route_map_device_v2";
      const SECURE_STORAGE_VERSION = "9.0"; // SecureStorage가 생긴 미니앱 버전
      const tg = window.Telegram?.WebApp;
      const PBKDF2_ITERATIONS = 600000;
      const HKDF_INFO = new TextEncoder().encode("route-map-v2");
      const OPEN_LIMIT_MS = 60 * 60 * 1000; // 연 지 60분이 지나면 데이터를 지우고 닫는다
      const PASSWORD_RULE = /^(?=.*[A-Za-z])(?=.*\d).{8,64}$/;
      const gate = document.getElementById("gate");
      const gateForm = document.getElementById("gate-form");
      const gateTitle = document.getElementById("gate-title");
      const gateText = document.getElementById("gate-text");
      const gatePw = document.getElementById("gate-pw");
      const gatePw2 = document.getElementById("gate-pw2");
      const gateSubmit = document.getElementById("gate-submit");
      const gateError = document.getElementById("gate-error");
      const notFound = document.getElementById("notfound");
      const NOT_FOUND_TITLE = "Page not found · GitHub Pages";

      function b64urlToBytes(text) {
        const base64 = text.replace(/-/g, "+").replace(/_/g, "/");
        const binary = atob(base64 + "=".repeat((4 - (base64.length % 4)) % 4));
        return Uint8Array.from(binary, (ch) => ch.charCodeAt(0));
      }

      function bytesToB64url(bytes) {
        let binary = "";
        bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      // mode: "register"(비밀번호 2칸 + 등록), "unlock"(비밀번호 1칸 + 열기), "message"(안내만). 화면마다 색·제목이 다르다.
      function showGate(mode, message = "") {
        const register = mode === "register";
        const input = mode !== "message";
        notFound.hidden = true;
        gate.hidden = false;
        gateForm.hidden = false;
        gateForm.classList.toggle("is-register", register);
        document.title = register ? "지도 폰 등록" : "경로 지도";
        gateTitle.textContent = register ? "📱 지도 폰 등록" : "🧭 경로 지도";
        gateText.textContent = message || (register
          ? "이 폰에서 경로 지도를 열 때 쓸 비밀번호를 정해 주세요.\n영문과 숫자를 섞어 8자 이상.\n다시 등록하면 이전 폰에서는 열리지 않습니다."
          : "폰 등록 때 정한 비밀번호를 넣어 주세요.");
        gateError.textContent = "";
        gatePw.hidden = !input;
        gatePw2.hidden = !register;
        gateSubmit.hidden = !input;
        gateSubmit.disabled = false;
        gateSubmit.textContent = register ? "등록" : "열기";
        gatePw.value = "";
        gatePw2.value = "";
      }

      // 쓸 수 없는 링크(등록 안 된 폰, 잘못된·만료된 링크, 시간이 지나 닫힘)는 404 화면처럼 보인다.
      function showNotFound(reason) {
        gateForm.onsubmit = null;
        gatePw.value = "";
        gatePw2.value = "";
        gate.hidden = true;
        document.getElementById("map").hidden = true;
        document.getElementById("panel").hidden = true;
        notFound.hidden = false;
        document.title = NOT_FOUND_TITLE;
        console.info("[ROUTE] not available", reason);
      }

      // 텔레그램 보안 저장소 읽기. 없거나 읽지 못하면 null.
      function loadDevice() {
        return new Promise((resolve) => {
          tg.SecureStorage.getItem(DEVICE_STORE_KEY, (error, value) => {
            if (error) console.warn("[ROUTE] secure storage read failed", error);
            try {
              const saved = !error && value ? JSON.parse(value) : null;
              resolve(saved && saved.pub && saved.salt && saved.iv && saved.wrapped ? saved : null);
            } catch (parseError) {
              console.warn("[ROUTE] secure storage value invalid", parseError?.name || parseError);
              resolve(null);
            }
          });
        });
      }

      function saveDevice(device) {
        return new Promise((resolve, reject) => {
          tg.SecureStorage.setItem(DEVICE_STORE_KEY, JSON.stringify(device), (error, stored) => {
            if (error || !stored) reject(new Error(String(error || "not stored")));
            else resolve();
          });
        });
      }

      async function passwordKey(password, salt) {
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt, iterations: PBKDF2_ITERATIONS },
          base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"],
        );
      }

      // 폰 등록: 열쇠를 만들고 비밀 열쇠는 비밀번호로 잠가 텔레그램 보안 저장소에 둔다. 공개 열쇠(압축형)를 돌려준다.
      async function registerDevice(password) {
        const pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", pair.publicKey)); // 04 | x | y
        const compressed = new Uint8Array(33);
        compressed[0] = raw[64] & 1 ? 3 : 2;
        compressed.set(raw.slice(1, 33), 1);
        const pkcs8 = new Uint8Array(await crypto.subtle.exportKey("pkcs8", pair.privateKey));
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const wrapped = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await passwordKey(password, salt), pkcs8));
        pkcs8.fill(0);
        const pub = bytesToB64url(compressed);
        await saveDevice({ pub, salt: bytesToB64url(salt), iv: bytesToB64url(iv), wrapped: bytesToB64url(wrapped) });
        return pub;
      }

      // 링크 풀기. 비밀번호가 틀리면 "password", 링크가 깨졌으면 "link", 시간이 지났으면 "expired" 오류.
      async function unlockRoute(device, password, sealedText) {
        let privateKey;
        try {
          const pkcs8 = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: b64urlToBytes(device.iv) },
            await passwordKey(password, b64urlToBytes(device.salt)), b64urlToBytes(device.wrapped),
          );
          privateKey = await crypto.subtle.importKey("pkcs8", pkcs8, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
        } catch (error) {
          throw new Error("password");
        }
        let body;
        try {
          const sealed = b64urlToBytes(sealedText);
          const ephemeral = await crypto.subtle.importKey("raw", sealed.slice(0, 65), { name: "ECDH", namedCurve: "P-256" }, false, []);
          const shared = await crypto.subtle.deriveBits({ name: "ECDH", public: ephemeral }, privateKey, 256);
          const hkdf = await crypto.subtle.importKey("raw", shared, "HKDF", false, ["deriveKey"]);
          const key = await crypto.subtle.deriveKey(
            { name: "HKDF", hash: "SHA-256", salt: new Uint8Array(32), info: HKDF_INFO },
            hkdf, { name: "AES-GCM", length: 256 }, false, ["decrypt"],
          );
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: sealed.slice(65, 77) }, key, sealed.slice(77));
          const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
          body = JSON.parse(await new Response(stream).text());
        } catch (error) {
          throw new Error("link");
        }
        if (!Number.isFinite(body?.x) || Date.now() / 1000 > body.x) throw new Error("expired");
        return body.d;
      }

      // 연 지 60분: 지도·데이터를 지우고 404 화면처럼 둔다(다시 보려면 텔레그램에서 새 링크).
      // 화면이 꺼지면 타이머가 멈출 수 있어 실제 시각으로 1분마다·화면 복귀 때·지도 조작 때 확인한다.
      function scheduleClose(map) {
        const openedAt = Date.now();
        let timer = null;
        const checkLimit = () => {
          if (Date.now() - openedAt < OPEN_LIMIT_MS) return;
          clearInterval(timer);
          document.removeEventListener("visibilitychange", onVisible);
          if (map) map.remove();
          document.getElementById("map").replaceChildren();
          document.getElementById("panel").replaceChildren();
          showNotFound("closed after time limit");
        };
        const onVisible = () => { if (document.visibilityState === "visible") checkLimit(); };
        timer = setInterval(checkLimit, 60 * 1000);
        document.addEventListener("visibilitychange", onVisible);
        if (map) map.on("click movestart zoomstart popupopen", checkLimit);
      }

      // 등록 화면: 보조기능의 미니앱 키보드 버튼으로 열린다. 공개 열쇠는 sendData로 챗봇에 보내고 미니앱은 닫힌다.
      function startRegister() {
        showGate("register");
        gateForm.onsubmit = async (event) => {
          event.preventDefault();
          const password = gatePw.value;
          if (!PASSWORD_RULE.test(password)) { gateError.textContent = "영문과 숫자를 섞어 8자 이상으로 정해 주세요."; return; }
          if (password !== gatePw2.value) { gateError.textContent = "비밀번호 확인이 다릅니다."; return; }
          gateSubmit.disabled = true;
          gateError.textContent = "";
          try {
            const pub = await registerDevice(password);
            gatePw.value = ""; gatePw2.value = "";
            console.info("[ROUTE] device key created");
            tg.sendData(JSON.stringify({ t: "map_reg", k: pub }));
          } catch (error) {
            console.error("[ROUTE] device register failed", error?.message || error?.name || error);
            gateSubmit.disabled = false;
            gateError.textContent = "등록하지 못했습니다. 텔레그램을 최신으로 업데이트한 뒤 다시 해 주세요.";
          }
        };
      }

      async function startUnlock(sealedText) {
        const device = await loadDevice();
        if (!device) {
          showNotFound("device not registered");
          return;
        }
        showGate("unlock");
        gateForm.onsubmit = async (event) => {
          event.preventDefault();
          gateSubmit.disabled = true;
          gateError.textContent = "";
          const password = gatePw.value;
          gatePw.value = "";
          try {
            const data = await unlockRoute(device, password, sealedText);
            gate.hidden = true;
            gateForm.onsubmit = null;
            scheduleClose(render(data));
            console.info("[ROUTE] unlocked");
          } catch (error) {
            gateSubmit.disabled = false;
            const reason = error?.message;
            console.warn("[ROUTE] unlock failed", reason);
            if (reason === "password") gateError.textContent = "비밀번호가 틀렸습니다.";
            else showNotFound(reason);
          }
        };
      }

      // 주소의 # 뒤(데이터·등록 표시)는 읽은 즉시 주소창·방문 기록에서 지운다(텔레그램 스크립트는 위에서 먼저 읽음).
      const hash = window.location.hash.replace(/^#/, "");
      history.replaceState(null, "", window.location.pathname + window.location.search);
      const params = new URLSearchParams(hash);
      const query = new URLSearchParams(window.location.search);
      // 텔레그램 안에서 연 미니앱인지: 키보드 버튼 미니앱은 initData가 비어 있으므로 platform으로 본다(브라우저는 "unknown").
      if (!tg || !tg.platform || tg.platform === "unknown") {
        // 텔레그램 미니앱으로 연 것이 아니면 아무것도 하지 않는다.
        showNotFound("not mini app");
      } else if (!window.crypto?.subtle || typeof DecompressionStream === "undefined" || !tg.isVersionAtLeast(SECURE_STORAGE_VERSION)) {
        tg.ready();
        showGate("message", "이 텔레그램에서는 열 수 없습니다.\n텔레그램을 최신으로 업데이트한 뒤 다시 열어 주세요.");
      } else {
        tg.ready();
        tg.expand();
        if (query.get("reg") === "1" || params.get("reg") === "1") startRegister();
        else if (tg.initData && /^[A-Za-z0-9_-]{100,}$/.test(params.get("r2") || "")) startUnlock(params.get("r2"));
        else showNotFound("bad link");
      }
    })();
  </script>
</body>
</html>
